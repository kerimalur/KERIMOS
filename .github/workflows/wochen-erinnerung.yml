name: KerimOS Wochenrueckblick-Erinnerung

# Erinnert sonntags an den Wochenrueckblick — aber nur, wenn fuer die zu Ende
# gehende Woche noch nichts geschrieben steht. Die offenen Wochenziele stehen
# im Text der Nachricht.
#
# Warum GitHub und nicht Vercel: der Hobby-Plan erlaubt genau EINEN eigenen
# Cron pro Tag, und der ist von /api/garmin-sync belegt.
#
# GitHub-Cron laeuft in UTC und kann sich 5-20 min verspaeten. 16:00 UTC ist
# 18:00 Zuercher Sommerzeit bzw. 17:00 Winterzeit; der Endpoint akzeptiert ab
# 16:00 Ortszeit und prueft selbst, dass wirklich Sonntag ist.
#
# Optionale Repository-Secrets:
#   KERIMOS_CRON_SECRET   derselbe Wert wie CRON_SECRET in Vercel
#   KERIMOS_URL           nur noetig, wenn die App woanders liegt

on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:

jobs:
  erinnern:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wochenrueckblick-Erinnerung ausloesen
        env:
          # URL als Standard im Workflow, nicht als Secret: sie ist kein
          # Geheimnis und steht ohnehin im Code. Ein Repository-Secret
          # KERIMOS_URL oder eine Variable gleichen Namens uebersteuert sie.
          URL: ${{ secrets.KERIMOS_URL || vars.KERIMOS_URL || 'https://kerimos.vercel.app' }}
          SECRET: ${{ secrets.KERIMOS_CRON_SECRET }}
        run: |
          # Frueher stieg dieser Schritt bei fehlenden Secrets mit "exit 0" aus.
          # Das ist genau das Muster, das man nie wieder findet: der Workflow
          # ist gruen, der Cron laeuft, und es passiert trotzdem nichts. Jetzt
          # wird der Aufruf in jedem Fall versucht — ohne Secret entscheidet
          # der Endpoint selbst, ob er ihn annimmt (er prueft nur, wenn in
          # Vercel CRON_SECRET gesetzt ist).
          if [ -z "$SECRET" ]; then
            echo "::warning::KERIMOS_CRON_SECRET ist nicht gesetzt. Der Aufruf laeuft"
            echo "::warning::ohne Authorization-Kopf. Das geht nur, solange in Vercel"
            echo "::warning::auch CRON_SECRET fehlt — dann ist der Endpoint offen."
            KOPF=()
          else
            # Das Geheimnis geht als Kopf, nicht als Query — Query-Parameter
            # landen in Server- und Proxy-Logs.
            KOPF=(-H "Authorization: Bearer ${SECRET}")
          fi

          for i in 1 2 3; do
            antwort=$(curl -s --max-time 45 -w "\n%{http_code}" \
              "${KOPF[@]}" "${URL}/api/wochen-erinnerung") && code=$(echo "$antwort" | tail -1)
            if [ "$code" = "200" ]; then
              echo "$antwort" | head -n -1
              exit 0
            fi
            echo "Versuch $i: HTTP ${code:-timeout} — retry in 15 s"
            sleep 15
          done
          echo "::error::KerimOS antwortet nicht (nach 3 Versuchen) — Erinnerung nicht verschickt."
          exit 1
